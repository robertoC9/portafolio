# ============================================================
# Configuración de despliegue en Netlify
# ============================================================
# El chatbot hace POST a /send. Como el sitio es estático, esa ruta no
# corresponde a ningún archivo: se reescribe (status 200 = reescritura, el
# navegador sigue viendo /send y mantiene método y cuerpo) a la función
# serverless que entrega el mensaje en Telegram.
#
# Solo se definen redirects: la configuración de build (carpeta base y de
# publicación) sigue siendo la que está guardada en el panel de Netlify.
# Las cabeceras de seguridad están en el archivo _headers.

[[redirects]]
  from = "/send"
  to = "/.netlify/functions/send"
  status = 200
  force = true

# Estos archivos son datos locales o código del backend: no forman parte del
# sitio publicado y se devuelven como 404 aunque Netlify los encuentre en la
# carpeta de publicación.
[[redirects]]
  from = "/comentarios.txt"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/comentarios/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
